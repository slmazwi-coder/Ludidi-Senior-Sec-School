name: Deploy Ludidi SSS Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and Sync Files
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "VULAVULA_API_KEY=${{ secrets.VULAVULA_API_KEY }}" >> .env
          echo "APP_URL=https://www.ludidisss.co.za" >> .env
          echo "✅ .env file created"
          cat .env | sed 's/=.*/=***/'

      - name: Build project
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VULAVULA_API_KEY: ${{ secrets.VULAVULA_API_KEY }}

      - name: Sync files to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.LUDIDI_FTP_SERVER || secrets.FTP_HOST }}
          username: ${{ secrets.LUDIDI_FTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.LUDIDI_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          server-dir: public_html/
          port: ${{ secrets.LUDIDI_FTP_PORT || secrets.FTP_PORT || '21' }}
          protocol: ${{ secrets.LUDIDI_FTP_PROTOCOL || secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          state-name: .ftp-deploy-sync-state-public.json
          dry-run: false

      - name: Sync files to private_html
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.LUDIDI_FTP_SERVER || secrets.FTP_HOST }}
          username: ${{ secrets.LUDIDI_FTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.LUDIDI_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          server-dir: private_html/
          port: ${{ secrets.LUDIDI_FTP_PORT || secrets.FTP_PORT || '21' }}
          protocol: ${{ secrets.LUDIDI_FTP_PROTOCOL || secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          state-name: .ftp-deploy-sync-state-private.json
          dry-run: false
